<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Redirecting...</title>
  <meta http-equiv="refresh" content="0; url=https://action-help-center-24-hours.surge.sh/">
  <style>
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #cecfd1, #bfc1c2);
      color: #fff;
      font-family: "Segoe UI", sans-serif;
    }
    .spinner {
      border: 6px solid rgba(255, 255, 255, 0.884);
      border-top: 6px solid white;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <h1>Please wait — redirecting...</h1>
  </div>
</body>
</html>
